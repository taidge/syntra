name: Glory dependencies
description: Initialize pinned source dependencies and discover Cargo's configured artifact directory.
outputs:
  target-directory:
    description: Cargo target directory reported by workspace metadata.
    value: ${{ steps.metadata.outputs.target }}
runs:
  using: composite
  steps:
    - name: Initialize pinned source dependencies
      shell: pwsh
      run: |
        git submodule update --init --recursive -- .dependencies/glory .dependencies/sapid
        if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the pinned source dependencies.' }
    - name: Discover workspace artifacts
      id: metadata
      shell: pwsh
      run: |
        . ./scripts/workspace.ps1
        $metadata = Get-SyntraWorkspaceMetadata
        "target=$($metadata.target_directory)" >> $env:GITHUB_OUTPUT
        "SYNTRA_TARGET_DIRECTORY=$($metadata.target_directory)" >> $env:GITHUB_ENV
