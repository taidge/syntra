name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --features contrix-frontend/ssr

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p contrix-server
      - uses: actions/upload-artifact@v4
        with:
          name: contrix-server-${{ matrix.os }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/contrix-server*

  frontend:
    name: Build Glory browser app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.129 --root "$RUNNER_TEMP/office-glory/tools"
      - shell: pwsh
        run: ./scripts/build-frontend.ps1 -BuildRoot '${{ runner.temp }}/office-glory' -Bindgen '${{ runner.temp }}/office-glory/tools/bin/wasm-bindgen'
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: ${{ runner.temp }}/office-glory/web

  e2e:
    name: E2E Tests
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ${{ runner.temp }}/office-glory/web
      - name: Build server
        run: cargo build -p contrix-server
      - name: Start server
        run: |
          cargo run -p contrix-server &
          sleep 5
        env:
          CONTRIX_STATIC_DIR: ${{ runner.temp }}/office-glory/web
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run API tests
        working-directory: e2e
        run: npx playwright test --grep @api
        env:
          API_URL: http://localhost:3000
      - name: Run browser tests
        working-directory: e2e
        run: npx playwright test --project ui-tests
        env:
          API_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ${{ runner.temp }}/office-glory/e2e/
          retention-days: 7
