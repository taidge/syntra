name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --features syntra-frontend/ssr

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --no-deps --features syntra-frontend/ssr -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --features syntra-frontend/ssr

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test release ZIP
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/syntra-web
      - run: cargo build --locked --release -p syntra-server --target ${{ matrix.target }}
      - name: Assemble release ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Target '${{ matrix.target }}' -SkipBuild
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
        working-directory: e2e
      - name: Test the extracted release ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:SYNTRA_TARGET_DIRECTORY 'dist/syntra-${{ matrix.target }}.zip'
          ./scripts/test-package.ps1 -ArchivePath $archive -BrowserTests
      - uses: actions/upload-artifact@v4
        with:
          name: syntra-${{ matrix.target }}
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/dist/syntra-${{ matrix.target }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke-${{ matrix.target }}
          path: |
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/result.json
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/logs/*.log
          retention-days: 7

  frontend:
    name: Build Glory browser app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.130
      - shell: pwsh
        run: ./scripts/build-frontend.ps1 -Release
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/syntra-web

  container:
    name: Build and test container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require a GitHub-hosted builder
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" != github-hosted ]]; then
            echo 'Container validation requires a GitHub-hosted runner.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-glory
      - name: Build the production image
        shell: bash
        run: docker build -f docker/Dockerfile -t "syntra-ci:${GITHUB_SHA}" .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Test the built image
        shell: pwsh
        run: ./scripts/test-package.ps1 -Image "syntra-ci:$env:GITHUB_SHA" -BrowserTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-smoke
          path: |
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/result.json
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/logs/*.log
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/browser/**/*.png
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/browser/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E Tests
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/syntra-web
      - name: Build server
        run: cargo build --locked -p syntra-server
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run API tests
        shell: pwsh
        run: ./scripts/test-e2e.ps1 -SkipBuild -Project api-tests
      - name: Run browser tests
        shell: pwsh
        run: ./scripts/test-e2e.ps1 -SkipBuild -Project ui-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/e2e-instance-*/playwright/
          retention-days: 7
