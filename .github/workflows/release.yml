name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: contrix-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: contrix-server.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: contrix-server
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.130
      - shell: pwsh
        run: ./scripts/package.ps1 -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: contrix-office-${{ matrix.target }}
          path: ${{ env.OFFICE_TARGET_DIRECTORY }}/dist/contrix-office-${{ matrix.target }}.zip

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            contrix-office-*/contrix-office-*.zip
          generate_release_notes: true
