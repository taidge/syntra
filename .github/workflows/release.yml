name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  frontend:
    name: Build release browser assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.130
      - shell: pwsh
        run: ./scripts/build-frontend.ps1 -Release
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/syntra-web
          if-no-files-found: error

  build-release:
    name: Build ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-glory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/syntra-web
      - run: cargo build --locked --release -p syntra-server --target ${{ matrix.target }}
      - name: Assemble release ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Target '${{ matrix.target }}' -SkipBuild
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
        working-directory: e2e
      - name: Test the extracted release ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:SYNTRA_TARGET_DIRECTORY 'dist/syntra-${{ matrix.target }}.zip'
          ./scripts/test-package.ps1 -ArchivePath $archive -BrowserTests
      - uses: actions/upload-artifact@v4
        with:
          name: syntra-${{ matrix.target }}
          path: ${{ env.SYNTRA_TARGET_DIRECTORY }}/dist/syntra-${{ matrix.target }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke-${{ matrix.target }}
          path: |
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/result.json
            ${{ env.SYNTRA_TARGET_DIRECTORY }}/package-smoke/*/logs/*.log
          retention-days: 7

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: syntra-*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            syntra-*/syntra-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
