[server]
host = "0.0.0.0"
port = 3000
cors_origins = ["http://localhost:8080", "http://localhost:3000"]

[database]
url = "sqlite://data/syntra.db?mode=rwc"
max_connections = 5
checkout_timeout_ms = 3000
operation_timeout_ms = 15000
busy_timeout_ms = 3000

[auth]
jwt_secret = "change-me-in-production-use-a-long-random-string"
jwt_expiry_hours = 24
refresh_expiry_days = 30

[storage]
upload_idle_timeout_seconds = 30
upload_total_timeout_seconds = 900
backend = "local"
base_path = "data/files"
max_upload_size_mb = 100
default_quota_mb = 5120
# backend = "s3"
# s3_bucket = "syntra-files"
# s3_region = "us-east-1"
# s3_access_key = ""
# s3_secret_key = ""
# s3_endpoint = ""

[rate_limit]
max_requests = 100
window_seconds = 60
enabled = true
trust_forwarded_headers = false

[ai]
enabled = false
endpoint = "https://api.openai.com/v1/chat/completions"
api_key = ""
model = ""
timeout_seconds = 30
max_requests_per_hour = 20
max_prompt_chars = 4000
max_document_chars = 40000
max_output_chars = 12000

[trash]
auto_delete_days = 30
auto_delete_enabled = false

# Ordinary history must be within both the newest N and maximum age (0 disables
# age expiry). Original version0 and bounded current/contiguous OT bases survive.
[maintenance]
history_enabled = true
history_max_versions = 100
history_max_age_days = 30
history_batch_size = 100
reconcile_enabled = true
# Unknown legacy keys are preserved by default. Enable ONLY if this database
# exclusively owns the ENTIRE S3 bucket or local base_path (no shared deployment).
reconcile_legacy_dedicated_namespace = false
interval_seconds = 300
# New and upgraded objects must pass a full first-discovery grace period.
orphan_grace_seconds = 86400
scan_page_size = 100
