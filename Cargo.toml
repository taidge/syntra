[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/server",
    "crates/frontend",
    "crates/doc-engine",
    "crates/collab",
    "crates/export",
]
exclude = [".dependencies/glory", ".dependencies/sapid"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Contrix Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/contrix-org/office"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1.54.1", features = ["full"] }

# Database
diesel = { version = "~2.3.14", features = ["sqlite", "chrono", "uuid"] }
diesel-async = { version = "~0.9.2", default-features = false, features = ["sqlite", "deadpool"] }
horme = { version = "=0.4.0", default-features = false, features = ["sqlite", "deadpool"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }

# Web
salvo = { version = "0.89", features = ["cors", "logging", "websocket", "serve-static", "cookie", "compression"] }

# Auth
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
argon2 = "0.5"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
rand = "0.10"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# Email
lettre = "0.11.23"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }

# Frontend
glory = { path = ".dependencies/glory/crates/glory", default-features = false }
sapid = { path = ".dependencies/sapid", features = ["editor", "files", "charts", "json", "dates"] }

# HTTP client
reqwest = { version = "0.13.5", features = ["json"] }

# Archive
zip = { version = "9.5", default-features = false, features = ["deflate"] }

# Office format parsing
quick-xml = "0.41"
calamine = "0.38"

# Temporary official upstream compatibility patch: the published Diesel 2.3.14
# caps libsqlite3-sys below the SQLite security fix. This verified upstream
# commit allows 0.39; remove this patch once a compatible Diesel release ships.
[patch.crates-io]
diesel = { git = "https://github.com/diesel-rs/diesel", rev = "fcd8d71e39bc2ba68b17dff0438b6aadd1869ca0" }
