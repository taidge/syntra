services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:8080"
    volumes:
      - app-data:/data
    environment:
      RUST_LOG: info
      SYNTRA_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET of at least 32 bytes}
    restart: unless-stopped

volumes:
  app-data:
