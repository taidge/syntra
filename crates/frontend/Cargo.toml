[package]
name = "contrix-frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Dioxus-based frontend for Contrix Office"

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
base64 = { workspace = true }
once_cell = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
contrix-doc-engine = { path = "../doc-engine" }

[dependencies.web-sys]
version = "0.3"
features = [
    "Headers",
    "Document",
    "HtmlDocument",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "File",
    "FormData",
    "HtmlInputElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "Window",
    "Navigator",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "Selection",
    "Range",
    "DomRect",
    "Node",
    "Text",
    "TreeWalker",
    "NodeFilter",
    "Performance",
    "ClipboardEvent",
    "DataTransfer",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "CustomEvent",
    "Location",
    "EventTarget",
    "console",
]
