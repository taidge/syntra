[package]
name = "contrix-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Glory and Sapid WebAssembly frontend for Contrix Office"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = ["glory/ssr"]

[dependencies]
contrix-doc-engine = { path = "../doc-engine" }
glory = { workspace = true }
sapid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
base64 = { workspace = true }
once_cell = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
glory = { workspace = true, features = ["web", "hydrate"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Headers",
    "Document",
    "HtmlDocument",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "CanvasRenderingContext2d",
    "File",
    "FilePropertyBag",
    "FormData",
    "HtmlInputElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "DomTokenList",
    "Clipboard",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "Window",
    "MediaQueryList",
    "Navigator",
    "WebSocket",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    "Selection",
    "Range",
    "DomRect",
    "Node",
    "Text",
    "TreeWalker",
    "NodeFilter",
    "Performance",
    "ClipboardEvent",
    "DataTransfer",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "CustomEvent",
    "Location",
    "History",
    "PopStateEvent",
    "EventTarget",
    "console",
]
