[package]
name = "syntra-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Salvo-based backend server for syntra"

[dependencies]
syntra-core = { path = "../core", features = ["async-db"] }
syntra-doc-engine = { path = "../doc-engine" }
syntra-collab = { path = "../collab" }
syntra-export = { path = "../export" }

salvo = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
horme = { workspace = true }
deadpool = { workspace = true }
futures-util = "0.3"
libsqlite3-sys = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
lettre = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
bytes = "1"
http-body-util = "0.1"
quick-xml = { workspace = true }
reqwest = { workspace = true }
zip = { workspace = true }
tempfile = "3"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tokio-tungstenite = "0.29"
