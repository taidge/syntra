<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Syntra Office</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <meta name="theme-color" content="#172554">
        <link rel="manifest" href="/manifest.webmanifest">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/syntra.svg">
        <link rel="icon" type="image/svg+xml" sizes="any" media="(prefers-color-scheme: dark)" href="/icons/syntra-dark.svg">
        <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
        <link rel="stylesheet" href="/assets/main.css">
        <link rel="stylesheet" href="/assets/sapid.css">
        <link rel="stylesheet" href="/assets/semantic-layout.css">
        <link rel="stylesheet" href="/assets/shell-layout.css">
        <link rel="stylesheet" href="/assets/calc-files-layout.css">
        <link rel="stylesheet" href="/assets/editors-layout.css">
        <link rel="stylesheet" href="/assets/ui-consistency.css">
        <script>
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || t === 'light') {
                    document.documentElement.dataset.theme = t;
                }
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="main"></div>
        <script type="module" src="/bootstrap.js"></script>
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('/service-worker.js').catch(function (err) {
                        console.warn('SW registration failed:', err);
                    });
                });
            }
        </script>
    </body>
</html>
